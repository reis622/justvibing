<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scout Panel v2 - Final Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Sayfanın boyunu kısıtlamıyoruz, doğal akışına bırakıyoruz */
        html, body {
            height: auto !important;
            min-height: 100vh;
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Kartların mobilde ve webde sıkışmaması için minimum yükseklik */
        .player-card {
            min-height: 450px;
            display: flex;
            flex-direction: column;
        }

        .glass-footer {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Kaydırma çubuğu */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 10px; }
        
        /* Kartların başarılarda yanlara taşmaması için */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-100 font-sans">

    <header class="sticky top-0 z-50 w-full p-4 border-b border-white/10 bg-[#0f172a]/90 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black uppercase italic text-green-500 tracking-tighter">Scout Panel</h1>
            <span class="text-[10px] opacity-40 uppercase font-bold tracking-widest">Live Stats</span>
        </div>
    </header>

    <main id="dataContainer" class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-48">
        </main>

    <div id="searchResultPanel" class="fixed inset-0 z-[60] bg-slate-950/95 backdrop-blur-xl p-4 flex flex-col hidden">
        <div class="max-w-2xl mx-auto w-full flex flex-col h-full pt-4">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-green-500 text-sm tracking-widest uppercase">Oyuncu Seçimi</h3>
                <button onclick="closeResults()" class="w-12 h-12 flex items-center justify-center bg-white/10 rounded-full text-2xl transition-transform active:scale-90">&times;</button>
            </div>
            <div id="searchResultList" class="flex flex-col gap-4 overflow-y-auto pb-32"></div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 glass-footer border-t border-white/10 p-5 z-50 shadow-[0_-20px_50px_rgba(0,0,0,0.5)]">
        <div class="max-w-xl mx-auto flex gap-3">
            <input type="text" id="futbolcuIsmi" 
                   class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl text-base outline-none focus:ring-2 ring-green-500 text-white" 
                   placeholder="Futbolcu ara..." autocomplete="off">
            <button id="inputButton" 
                    class="bg-green-600 hover:bg-green-500 px-8 py-4 rounded-2xl font-black text-sm active:scale-95 transition-all shadow-lg shadow-green-900/40 uppercase">ARA</button>
        </div>
        <div class="h-[env(safe-area-inset-bottom)]"></div>
    </div>

<script>
    const isimInput = document.getElementById('futbolcuIsmi');
    const inputButton = document.getElementById('inputButton');
    const dataContainer = document.getElementById('dataContainer');
    const searchPanel = document.getElementById('searchResultPanel');
    const searchResultList = document.getElementById('searchResultList');

    const getBaseUrl = () => window.location.origin;

    async function performSearch() {
        const query = isimInput.value.trim();
        if (query.length < 2) return;
        inputButton.innerText = "...";
        inputButton.disabled = true;
        searchResultList.innerHTML = '<div class="flex justify-center py-20"><div class="animate-spin h-10 w-10 border-4 border-green-500 border-t-transparent rounded-full"></div></div>';
        searchPanel.classList.remove('hidden');
        try {
            const response = await fetch(`/oneriler?q=${encodeURIComponent(query)}`);
            const data = await response.json();
            renderSearchResults(data);
        } catch (e) { searchResultList.innerHTML = '<p class="text-center text-red-400">Sunucu hatası!</p>'; }
        finally { inputButton.innerText = "ARA"; inputButton.disabled = false; }
    }

    function renderSearchResults(results) {
        searchResultList.innerHTML = '';
        if (results.length === 0) { searchResultList.innerHTML = '<p class="text-center py-10 opacity-50">Sonuç bulunamadı.</p>'; return; }
        results.forEach(p => {
            const div = document.createElement('div');
            div.className = "flex items-center gap-4 p-4 bg-white/5 rounded-2xl border border-white/10 active:bg-white/20 transition-all";
            div.innerHTML = `
                <img src="${p.photo}" class="w-14 h-20 rounded-lg object-cover bg-slate-800" onerror="this.src='https://via.placeholder.com/60x80'">
                <div class="flex-1">
                    <p class="text-white font-bold text-lg leading-tight">${p.name}</p>
                    <p class="text-green-500 text-xs font-bold uppercase mt-1">${p.club}</p>
                </div>
                <button class="bg-green-600 font-black px-5 py-2 rounded-xl text-[10px] uppercase">SEÇ</button>
            `;
            div.onclick = () => { closeResults(); fetchDetay(p.id); };
            searchResultList.appendChild(div);
        });
    }

    function closeResults() { searchPanel.classList.add('hidden'); isimInput.value = ""; }

    async function fetchDetay(path) {
        try {
            const response = await fetch(`/detay?path=${encodeURIComponent(path)}`);
            const data = await response.json();
            const randomId = "id_" + Date.now();
            
            const achievements = (data.achievements || []).map(a => `
                <span class="bg-yellow-500/10 text-yellow-500 text-[9px] px-2 py-1 rounded border border-yellow-500/20 whitespace-nowrap">
                    ${a.count}x ${a.title}
                </span>`).join('');

            const cardHTML = `
                <div class="player-card relative bg-slate-900/80 border border-white/10 rounded-[2.5rem] overflow-hidden shadow-2xl p-6 group" id="${randomId}">
                    <button onclick="deleteCard('${randomId}')" class="absolute top-6 right-6 w-8 h-8 bg-white/5 hover:bg-red-600 text-white rounded-full flex items-center justify-center transition-all z-10">&times;</button>
                    
                    <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar">${achievements}</div>
                    
                    <div class="flex gap-6 items-start mb-8">
                        <img src="${data.foto}" class="w-28 h-36 rounded-2xl object-cover border-2 border-white/5 bg-slate-800 shadow-2xl" onerror="this.src='https://via.placeholder.com/112x144'">
                        <div class="flex-1">
                            <h2 class="text-2xl font-black leading-tight uppercase tracking-tighter mb-1">${data.isim}</h2>
                            <p class="text-green-500 font-bold text-xs uppercase mb-5 tracking-wide">${data.takim}</p>
                            
                            <div class="space-y-2 text-[11px] text-slate-400 font-bold uppercase">
                                <div class="flex justify-between border-b border-white/5 pb-1"><span>DOĞUM:</span> <b class="text-slate-100">${data.dogum}</b></div>
                                <div class="flex justify-between border-b border-white/5 pb-1"><span>MEVKİ:</span> <b class="text-slate-100">${data.mevki}</b></div>
                                <div class="flex justify-between border-b border-white/5 pb-1"><span>BOY:</span> <b class="text-slate-100">${data.boy}</b></div>
                                <div class="flex justify-between"><span>UYRUK:</span> <b class="text-slate-100">${data.uyruk}</b></div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center">
                            <p class="text-[9px] text-slate-500 font-black uppercase mb-1">Tercih Edilen Ayak</p>
                            <p class="text-xs font-bold uppercase">${data.ayak || '-'}</p>
                        </div>
                        <div class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center">
                            <p class="text-[9px] text-slate-500 font-black uppercase mb-1">Sözleşme Bitiş</p>
                            <p class="text-xs font-bold text-red-400 uppercase">${data.sozlesme_bit || '-'}</p>
                        </div>
                    </div>

                    <div class="mt-auto flex justify-between items-end pt-6 border-t border-white/10">
                        <div>
                            <p class="text-[10px] text-slate-500 uppercase font-black tracking-widest mb-1">Piyasa Değeri</p>
                            <p class="text-4xl font-black text-green-500 tracking-tighter">${data.piyasa_degeri}</p>
                        </div>
                        <img src="https://www.transfermarkt.com.tr/favicon.ico" class="w-6 h-6 opacity-30 invert">
                    </div>
                </div>`;
            
            renderCard(cardHTML);
            localStorage.setItem(randomId, cardHTML);
        } catch (e) { alert("Hata oluştu!"); }
    }

    function renderCard(htmlContent) {
        const temp = document.createElement('div');
        temp.innerHTML = htmlContent;
        dataContainer.prepend(temp.firstElementChild);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteCard(id) {
        const el = document.getElementById(id);
        el.style.opacity = '0';
        el.style.transform = 'scale(0.9)';
        setTimeout(() => { localStorage.removeItem(id); el.remove(); }, 300);
    }

    function loadSaved() {
        Object.keys(localStorage).sort().forEach(key => {
            if(key.startsWith('id_')) renderCard(localStorage.getItem(key));
        });
    }

    inputButton.addEventListener("click", performSearch);
    isimInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(); });
    window.onload = loadSaved;
</script>
</body>
</html>
